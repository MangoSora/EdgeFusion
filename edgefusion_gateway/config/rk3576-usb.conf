# RK3576 / DshanPi-A1 / Ubuntu 24.04 Armbian: software baseline.
# Run from edgefusion_gateway using: bash scripts/run-usb.sh
# USB source settings require a process restart; only MJPEG is supported in v1.
source_type = v4l2
video_device = /dev/video11
capture_width = 640
capture_height = 480
capture_fps = 30
video_bitrate_kbps = 1500

# Shared input timeout and retry interval (also used by USB).
rtsp_timeout_us = 5000000
rtsp_reconnect_s = 3
rtsp_transport = tcp
# Optional legacy RTSP input: set source_type=rtsp and supply rtsp_url.
rtsp_url =
# Start with recording and Web preview. Enable RTSP forwarding after baseline validation.
rtsp_server_enable = 0
rtsp_server_port = 8554

storage_dir = data/recordings
segment_seconds = 60
storage_min_free_mb = 500
segment_prefix = rec
sqlite_db_path = data/gateway.db

web_bind = 0.0.0.0
web_port = 8080
web_root = web
web_mjpeg_fps = 5
ai_frame_width = 640
ai_jpeg_quality = 70
# Offline baseline: cloud AI is optional and disabled.
ai_enable = 0
anthropic_auth_token =
alarm_gpio_led = -1
alarm_gpio_buzzer = -1
mqtt_enable = 0
log_level = info
log_file =
